# Baseline: NGINX API gateway on RHEL 9 in a DMZ, fronting IBM ACE.
#
# Adapt every value. The comments say WHY, so you can tell which lines are
# load-bearing and which are placeholders.
#
# Validate before reload:  nginx -t  &&  nginx -T | less

# Internal DNS. Without a resolver, upstream hostnames are resolved ONCE at
# startup and a backend IP change needs a reload before traffic recovers.
resolver 10.0.0.10 10.0.0.11 valid=30s ipv6=off;
resolver_timeout 5s;

# On RHEL 9 the systemd unit's LimitNOFILE caps what workers can actually open.
# Raise both together, or worker_connections is a number that does nothing.
worker_rlimit_nofile 65535;

log_format gw escape=json
  '$time_iso8601 $request_id $remote_addr "$request" $status '
  '$body_bytes_sent rt=$request_time urt=$upstream_response_time '
  'ua=$upstream_addr us=$upstream_status host=$host';
# $upstream_response_time next to $request_time is the field that answers
# "was it us or ACE" - the first question in every performance incident.
access_log /var/log/nginx/gateway.log gw;

server_tokens off;
ssl_session_cache shared:SSL:20m;
ssl_session_timeout 1h;

# Protect ACE: its flow instances are a fixed pool, so a client burst that
# reaches it consumes every instance and degrades unrelated interfaces.
limit_req_zone  $binary_remote_addr zone=api:10m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=conn:10m;

upstream ace_orders {
    zone ace_orders 64k;
    server ace01.internal:7800 max_fails=2 fail_timeout=10s;
    server ace02.internal:7800 max_fails=2 fail_timeout=10s;
    keepalive 32;
}

# Catch-all: answer nothing to an unknown Host. Without this the gateway
# responds to scanners and host-header probes on every vhost it fronts.
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate     /etc/pki/tls/certs/gateway.crt;
    ssl_certificate_key /etc/pki/tls/private/gateway.key;
    return 444;
}

server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;   # redirect only; never proxy on 80
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/pki/tls/certs/gateway.crt;
    ssl_certificate_key /etc/pki/tls/private/gateway.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    # RHEL 9's system-wide crypto policy also constrains this. Check with
    # update-crypto-policies --show before blaming nginx for a rejected client.

    # Mutual TLS. 'optional' pushes the decision into ACE, which usually does
    # not handle it - decide here.
    ssl_verify_client on;
    ssl_client_certificate /etc/pki/tls/certs/partner-ca.crt;
    ssl_verify_depth 2;

    # A DMZ normally has no egress to the CA's OCSP responder, so stapling
    # fails silently and adds handshake latency. Enable only with proven egress.
    ssl_stapling off;

    # Reject at the edge. Must be <= the ACE parser limit AND <= MQ MAXMSGL on
    # every queue in the path, or the payload is fully paid for then rejected.
    client_max_body_size 8m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    proxy_intercept_errors on;
    error_page 500 502 503 504 = @gw_error;   # never leak an ACE error body

    location @gw_error {
        default_type application/json;
        add_header Retry-After 10 always;
        return 503 '{"error":"service_unavailable","requestId":"$request_id"}';
    }

    location /v1/orders {
        limit_req  zone=api burst=20 nodelay;
        limit_conn conn 50;

        proxy_pass http://ace_orders;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # --- trust boundary ------------------------------------------------
        # OVERWRITE identity headers. Never forward $http_x_* for anything
        # ACE authorises on: the caller controls those.
        proxy_set_header X-Request-ID   $request_id;
        proxy_set_header Host           $host;
        proxy_set_header X-Real-IP      $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-DN    $ssl_client_s_dn;
        proxy_set_header X-Client-Verify $ssl_client_verify;

        # --- timeout budget -------------------------------------------------
        # MUST exceed the ACE flow's total budget. If NGINX gives up first the
        # client sees 504 while the flow keeps running and still commits its
        # MQ put - a duplicate-transaction generator.
        proxy_connect_timeout 5s;
        proxy_send_timeout   30s;
        proxy_read_timeout  120s;

        # --- retries ---------------------------------------------------------
        # The DEFAULT is "error timeout", which re-sends a slow request to the
        # other ACE server: both complete, both put to MQ. Off unless this
        # route is genuinely idempotent.
        proxy_next_upstream off;
    }
}
